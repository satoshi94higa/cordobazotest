<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Lo que vuelve a mirarnos: El Cordobazo</title>
    <meta name="theme-color" content="#1a1a1a" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <style>
      /* Base fonts that load instantly */
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #FDFBF7;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
      }

      /* Instant Loading Splash Screen Overlay */
      #kiosk-splash-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #1A1A1A;
        color: #FDFBF7;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        transition: opacity 0.5s ease-out;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }

      .splash-content {
        max-width: 600px;
        animation: pulseFade 2s ease-in-out infinite;
      }

      .splash-title-brand {
        color: #B91C1C;
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.35em;
        margin-bottom: 24px;
        font-family: monospace;
      }

      .splash-title {
        font-family: "Georgia", serif;
        font-size: 32px;
        font-weight: normal;
        margin: 0 0 16px 0;
        letter-spacing: -0.02em;
        line-height: 1.3;
      }

      .splash-subtitle {
        font-size: 14px;
        opacity: 0.6;
        letter-spacing: 0.05em;
        line-height: 1.6;
        margin-bottom: 40px;
        max-width: 480px;
        margin-left: auto;
        margin-right: auto;
      }

      .splash-indicator {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }

      .splash-spinner {
        width: 20px;
        height: 20px;
        border: 2px solid rgba(253, 251, 247, 0.1);
        border-top: 2px solid #B91C1C;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      .splash-loading-text {
        font-family: monospace;
        font-size: 9px;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        opacity: 0.5;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes pulseFade {
        0%, 100% { opacity: 0.95; }
        50% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <!-- 
      This static loader is directly placed inside #root. 
      It displays instantaneously. Once React mounts, it compiles and
      completely replaces the innerHTML of #root with the actual interactive app.
    -->
    <div id="root">
      <div id="kiosk-splash-loader">
        <div class="splash-content">
          <div class="splash-title-brand">MUESTRA FOTOGRÁFICA INTERACTIVA</div>
          <h1 class="splash-title">Lo que vuelve a mirarnos:<br>El Cordobazo</h1>
          <p class="splash-subtitle">Iniciando el mapa e integrando coordenadas georreferenciadas. Por favor espere...</p>
          <div class="splash-indicator">
            <div class="splash-spinner"></div>
            <span class="splash-loading-text">CARGANDO MODO KIOSCO</span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="src/main.tsx"></script>
  </body>
</html>
